spring.application.name=GrievanceService
server.port=8082

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/civicpulse_grievance_db}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.datasource.password=21030-Cm-108

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Azure Blob Storage
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:civicpulse-images}
